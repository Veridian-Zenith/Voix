# Voix configuration
#
# This file ships closed by default: no user or group is trusted, no target is
# unconfined, and the ACL contains no permits. Add only the rules you need.
# Validate changes with `voix -C /etc/voix.conf -c` before deploying.
#
# See docs/CONFIG.md for the full schema and docs/SUDO.md for worked examples.

# DIRECTLY REQUESTED DESTRUCTIVE OPERATIONS REQUIRE A ROOT SHELL
# ---------------------------------------------------------------
# Disk and partition writes are refused when they are the command Voix is
# asked to execute: cfdisk, fdisk, sfdisk, parted, wipe, wipefs, shred,
# mkswap, the whole mkfs* family, `dd` writing to a raw block device, and
# `rm -rf /`.
#
# This check runs BEFORE policy evaluation, so nothing in this file can
# permit a directly requested command - not a permit rule, not `wheel`
# membership, not `sudo -n`. The check does not inspect commands launched
# by a permitted shell or interpreter. To perform these operations, use a
# shell already running as root: TTY login, `su -`, or bare `-i`. Inside
# that shell Voix is no longer in the request path, so the tools behave as
# ordinary commands.
#
#   $ sudo -u root -i lsblk      # runs lsblk as root, then exits
#   $ sudo -u root -i            # bare: opens a standalone root shell
#   $ sudo -u root -i cfdisk /dev/sda   # BLOCKED - naming a command keeps
#                                       # the request brokered, so the
#                                       # gate still applies
#
# The bare form needs the target's login shell to be ABSENT from the
# blocklist below. Root's shell is /bin/bash, and this sample blocklists
# it - so on a default install `sudo -u root -i` is refused. Remove the
# /bin/bash entry below to enable the standalone shell.
#
# Day-to-day service administration belongs in the `acl` block below.

# Core system settings
core:
  # Private directory for persist tickets. It must exist, be owned by root,
  # and not be group/world writable.
  sanctuary: /var/lib/voix
  paths:
    - /bin
    - /sbin
    - /usr/bin
    - /usr/sbin

  # Whether to default to login shell mode.
  login_shell: false

  # Whether to suppress stderr log output.
  suppress_stderr: true

  # Targets that receive the full "system" treatment: retained capabilities,
  # no seccomp, no file-descriptor scrubbing, and a fully preserved environment
  # (including loader/interpreter variables such as LD_* and PYTHON*).
  #
  # This is intentionally EMPTY. Unconfined targets bypass most of Voix's
  # confinement, so enable one only for a specific package-manager workflow.
  # For example, on Arch add `root` and `alpm` here if you want
  # `voix pacman -Syu` to keep working; on Debian, `root` or `_apt`.
  # Prefer an explicit `profile: privileged` rule over making every command
  # for that target unconfined.
  unconfined_targets: []

# Access Control List
#
# Empty by default: a fresh install permits nothing. Uncomment and adapt the
# examples below. Rules are evaluated in file order and the first match wins.
#
# acl:
#   group:
#     wheel:
#       # Trust group members without a password. Do not add `keepenv`
#       # unless the target genuinely needs the caller's environment.
#       - action: permit
#         options: [trust]
#   user:
#     alice:
#       # Password-authenticate, then reuse the ticket for 15 minutes.
#       - action: permit
#         options: [persist]
#         command: /usr/bin/systemctl
#         args: [restart, nginx]
#     deploy:
#       # A narrowly scoped command as a dedicated service account.
#       - action: permit
#         target: deploy
#         command: /usr/bin/systemctl
#         args: [restart, myapp]
acl:
  user: {}
  group: {}

# Security Policies
security:
  # Define named security profiles. The built-in `restricted` profile is used
  # when a rule does not name one.
  profiles:
    restricted:
      retain_full_capabilities: false
      enable_seccomp: true
      enable_resource_limits: true
      scrub_environment: true
    privileged:
      retain_full_capabilities: true
      enable_seccomp: false
      enable_resource_limits: false
      scrub_environment: false
      preserve_full_environment: false
  blocklist:
    - /bin/sh
    - /bin/bash        # remove this entry to allow a bare `voix -u root -i`
                       # to open a standalone root shell
    - /bin/dash
    - /bin/zsh
    - /usr/bin/bash
    - /usr/bin/dash
    - /usr/bin/zsh
    - /usr/bin/env
