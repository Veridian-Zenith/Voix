# Voix configuration

# DESTRUCTIVE OPERATIONS REQUIRE A DIRECT ROOT LOGIN
# ---------------------------------------------------------------
# Disk and partition rites are refused unconditionally: cfdisk, fdisk,
# sfdisk, parted, wipe, wipefs, shred, mkswap, the whole mkfs* family,
# `dd` writing to a raw block device, and `rm -rf /`.
#
# This check runs BEFORE policy evaluation, so nothing in this file can
# permit them - not a permit rule, not `wheel` membership, not `sudo -n`.
# To perform them, log in as root directly: TTY login, `su -`, or
# `sudo -u root -i`. Inside that shell Voix is no longer in the request
# path, so the tools behave as ordinary commands.
#
#   $ sudo -u root -i lsblk      # runs lsblk as root, then exits
#   $ sudo -u root -i            # bare: opens a standalone root shell
#   $ sudo -u root -i cfdisk /dev/sda   # BLOCKED - naming a command keeps
#                                       # the request brokered, so the
#                                       # gate still applies
#
# The bare form needs the target's login shell to be ABSENT from the
# blocklist below. Root's shell is /bin/bash, and this sample blocklists
# it - so on a default install `sudo -u root -i` is refused. Remove the
# /bin/bash entry below to enable the standalone shell.
#
# Day-to-day service administration belongs in the `acl` block below.

# Core system settings
core:
  sanctuary: /var/lib/voix
  paths:
    - /bin
    - /sbin
    - /usr/bin
    - /usr/sbin

  # Whether to default to login shell mode
  login_shell: false

  # Whether to suppress stderr log output
  suppress_stderr: true

  # Targets that receive the full "system" treatment: retained capabilities,
  # no seccomp, no file-descriptor scrubbing, and a fully preserved environment
  # (including loader/interpreter variables such as LD_* and PYTHON*). This is
  # required for package managers: pacman runs as `root` and must chown its
  # download directories (needs CAP_CHOWN), while `alpm` is its internal
  # unprivileged drop-user that also needs the full environment for AUR helpers.
  #
  # `root` is included by default so `voix pacman -Syu` works out of the box.
  # On other distributions set the equivalent package-manager target here
  # (e.g. `root` for apt/dnf, or `_apt` for Debian's split-uid helper). You can
  # remove `root` to confine generic root commands (then grant pacman
  # explicitly via a rule with `profile: privileged`).
  unconfined_targets:
    - root
    - alpm

# Access Control List
acl:
  group:
    wheel:
      - action: permit
        options: [trust, keepenv]
  user:
    root:
      - action: permit
        options: [trust, keepenv]

# Security Policies
security:
  # Define named security profiles
  profiles:
    restricted:
      retain_full_capabilities: false
      enable_seccomp: true
      enable_resource_limits: true
      scrub_environment: true
    privileged:
      retain_full_capabilities: true
      enable_seccomp: false
      enable_resource_limits: false
      scrub_environment: false
      preserve_full_environment: false
  blocklist:
    - /bin/sh
    - /bin/bash        # remove this entry to allow a bare `voix -u root -i`
                       # to open a standalone root shell
    - /bin/dash
    - /bin/zsh
    - /usr/bin/bash
    - /usr/bin/dash
    - /usr/bin/zsh
    - /usr/bin/env
