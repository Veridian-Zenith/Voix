name: Test Suite

# Forgejo Actions workflow for git.gay.
# Workflows are read from .forgejo/workflows. Every `uses:` is a fully
# qualified URL (https://code.forgejo.org/actions/...) so resolution never
# depends on the instance's DEFAULT_ACTIONS_URL.
# `runs-on: ubuntu-latest` must match a label advertised by the runner
# registered on git.gay; change it here if yours is labelled differently.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@v7.0.1

      - name: Install dependencies and LLVM 23
        run: |
          set -euo pipefail
          # Bare Debian container, not ubuntu-latest: no cmake, pkg-config,
          # lsb_release, or add-apt-repository (llvm.sh exits 127/4 without the
          # last two), and xz-utils is needed to unpack the LLVM tarballs.
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            ca-certificates curl wget git gnupg lsb-release xz-utils \
            software-properties-common \
            cmake pkg-config ninja-build \
            libpam0g-dev libcap-dev libseccomp-dev libyaml-cpp-dev \
            ccache
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          $SUDO ./llvm.sh 23
          $SUDO apt-get install -y --no-install-recommends clang-23 lld-23

          # CMakeLists requires >= 3.30; Debian oldstable ships 3.25.
          cmake_ver=4.4.5
          cmake_sha=ed85135c5a5135b45e50423cb406dea04ca3338da0b8ef3c9ede963559680be0
          have=$(cmake --version 2>/dev/null | sed -n '1s/.*version *//p' || true)
          if [ -z "$have" ] || [ "$(printf '%s\n3.30\n' "$have" | sort -V | head -n 1)" != "3.30" ]; then
            echo "cmake ${have:-missing} is older than 3.30; installing CMake ${cmake_ver}"
            archive="/tmp/cmake-${cmake_ver}.tar.gz"
            curl -fsSL -o "$archive" \
              "https://github.com/Kitware/CMake/releases/download/v${cmake_ver}/cmake-${cmake_ver}-linux-x86_64.tar.gz"
            printf '%s  %s\n' "$cmake_sha" "$archive" | sha256sum -c -
            if [ -w /usr/local/bin ]; then
              tar -xzf "$archive" -C /usr/local --strip-components=1
            else
              mkdir -p "$HOME/.local/cmake"
              tar -xzf "$archive" -C "$HOME/.local/cmake" --strip-components=1
              for path_file in "${GITHUB_PATH:-}" "${FORGEJO_PATH:-}"; do
                [ -n "$path_file" ] && echo "$HOME/.local/cmake/bin" >>"$path_file"
              done
              export PATH="$HOME/.local/cmake/bin:$PATH"
            fi
          fi
          cmake --version | head -n 1

      # Forgejo stores the cache on the runner, not the server. Caching only
      # affects build time, so a cache server that is unavailable or
      # misconfigured must not fail the suite.
      - name: Restore ccache
        continue-on-error: true
        uses: https://code.forgejo.org/actions/cache@v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ forgejo.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure CMake (Debug mode)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-23 \
            -DCMAKE_CXX_COMPILER=clang++-23 \
            -DENABLE_PERMISSIONS=OFF

      - name: Build and Run Tests
        run: |
          cmake --build build
          ctest --test-dir build --output-on-failure
