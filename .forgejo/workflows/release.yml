name: Release Artifacts

# Forgejo Actions workflow for git.gay.
#
# x86_64 only: git.gay provides no aarch64 runner, and cross-building aarch64
# from x86_64 cannot link the required aarch64 PAM/libcap/libseccomp/yaml-cpp
# (see packaging/README.md). There is no aarch64 job.
#
# The job runs in a bare Debian container (unprivileged runner), so every tool
# the build touches is installed explicitly here instead of being inherited
# from a GitHub hosted image.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and sign (e.g. v4.15.0). Leave empty for a build-only run (no release)."
        required: false
        type: string

env:
  # Full 40-character fingerprint of the primary GPG release-signing key (ed25519).
  GPG_FINGERPRINT: "7887165D6B07DE7785BD536E5239ACB42207EE03"

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Determine target tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          if [[ -n "$tag" ]]; then
            publish=true
          else
            publish=false
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "publish=$publish" >>"$GITHUB_OUTPUT"
          echo "Resolved tag='${tag}' publish='${publish}'"

  build:
    name: Build x86_64-bin
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install the full build toolchain
        run: |
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi

          # The runner image ships no cmake, pkg-config, lsb_release, or
          # add-apt-repository; llvm.sh exits 127 without lsb_release and 4
          # without add-apt-repository, before it installs anything. xz-utils is
          # needed to unpack the LLVM tarballs, binutils supplies readelf.
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            ca-certificates curl wget git gnupg lsb-release xz-utils \
            software-properties-common \
            cmake pkg-config ninja-build binutils \
            libpam0g-dev libcap-dev libseccomp-dev libyaml-cpp-dev

          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          $SUDO ./llvm.sh 22
          $SUDO apt-get install -y --no-install-recommends clang-22 lld-22

          # CMakeLists requires >= 3.30; Debian oldstable ships 3.25, so fall
          # back to the pinned upstream build (checksum from the release API).
          cmake_ver=4.4.5
          cmake_sha=ed85135c5a5135b45e50423cb406dea04ca3338da0b8ef3c9ede963559680be0
          have=$(cmake --version 2>/dev/null | sed -n '1s/.*version *//p' || true)
          if [ -z "$have" ] || [ "$(printf '%s\n3.30\n' "$have" | sort -V | head -n 1)" != "3.30" ]; then
            echo "cmake ${have:-missing} is older than 3.30; installing CMake ${cmake_ver}"
            archive="/tmp/cmake-${cmake_ver}.tar.gz"
            curl -fsSL -o "$archive" \
              "https://github.com/Kitware/CMake/releases/download/v${cmake_ver}/cmake-${cmake_ver}-linux-x86_64.tar.gz"
            printf '%s  %s\n' "$cmake_sha" "$archive" | sha256sum -c -
            if [ -w /usr/local/bin ]; then
              tar -xzf "$archive" -C /usr/local --strip-components=1
            else
              mkdir -p "$HOME/.local/cmake"
              tar -xzf "$archive" -C "$HOME/.local/cmake" --strip-components=1
              for path_file in "${GITHUB_PATH:-}" "${FORGEJO_PATH:-}"; do
                [ -n "$path_file" ] && echo "$HOME/.local/cmake/bin" >>"$path_file"
              done
              export PATH="$HOME/.local/cmake/bin:$PATH"
            fi
          fi

          cmake --version | head -n 1
          clang-22 --version | head -n 1
          ninja --version

      - name: Verify the tag matches the project version
        if: needs.resolve.outputs.tag != ''
        run: |
          set -euo pipefail
          ver="${RELEASE_TAG#v}"
          grep -q "set(VOIX_VERSION_STRING \"${ver}\")" CMakeLists.txt \
            || { echo "error: tag ${RELEASE_TAG} does not match VOIX_VERSION_STRING in CMakeLists.txt" >&2; exit 1; }
          echo "tag ${RELEASE_TAG} matches project version ${ver}"

      - name: Ensure a static libyaml-cpp.a is available
        run: |
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi

          # VOIX_STATIC_YAML_CPP=ON links libyaml-cpp.a so the shipped binary
          # carries no versioned yaml-cpp soname. Not every -dev package ships
          # the archive, and find_library() would abort the configure, so build
          # yaml-cpp from source when the distro has no static library.
          if find /usr/lib /usr/local/lib -name 'libyaml-cpp.a' -print -quit 2>/dev/null | grep -q .; then
            echo "using the installed static archive:"
            find /usr/lib /usr/local/lib -name 'libyaml-cpp.a' -print
            exit 0
          fi

          echo "libyaml-cpp.a not found; building yaml-cpp 0.8.0 from source"
          git clone --depth 1 --branch 0.8.0 https://github.com/jbeder/yaml-cpp.git /tmp/yaml-cpp
          cmake -S /tmp/yaml-cpp -B /tmp/yaml-cpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DYAML_CPP_BUILD_TOOLS=OFF \
            -DYAML_CPP_BUILD_TESTS=OFF \
            -DYAML_CPP_BUILD_CONTRIB=OFF
          cmake --build /tmp/yaml-cpp/build
          $SUDO cmake --install /tmp/yaml-cpp/build --prefix /usr/local
          test -f /usr/local/lib/libyaml-cpp.a

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCMAKE_C_COMPILER=clang-22 \
            -DVOIX_ARCH=x86-64 \
            -DVOIX_STATIC_YAML_CPP=ON \
            -DENABLE_PERMISSIONS=OFF

      - name: Build
        run: cmake --build build

      - name: Verify binary architecture and linkage
        run: |
          set -euo pipefail
          machine=$(readelf -h build/voix | sed -n 's/^ *Machine: *//p')
          echo "ELF machine: ${machine}"
          if [ "${machine}" != "Advanced Micro Devices X86-64" ]; then
            echo "error: expected x86-64 binary, got '${machine}'" >&2
            exit 1
          fi
          # The portable artifact must not depend on a versioned yaml-cpp soname.
          if ldd build/voix | grep -q 'libyaml-cpp'; then
            echo "error: binary still links libyaml-cpp dynamically" >&2
            ldd build/voix | grep 'libyaml-cpp' >&2
            exit 1
          fi
          echo "no dynamic yaml-cpp dependency"
          ./build/voix --version

      - name: Prepare Package
        run: |
          set -euo pipefail
          mkdir -p voix-bin
          cp build/voix voix-bin/
          cp pam.d/voix voix-bin/voix.pam
          cp config/voix.conf voix-bin/
          cp docs/voix.1 voix-bin/
          cp README.md voix-bin/
          cp LICENSE voix-bin/
          tar -czf voix-x86_64-bin.tar.gz voix-bin/
          tar -tzf voix-x86_64-bin.tar.gz | sort

      # Forgejo stores workflow artifacts server-side (ARTIFACT_RETENTION_DAYS,
      # 90 days by default), so build-only dispatches still leave a downloadable
      # tarball in the Actions UI.
      - name: Upload Artifact
        uses: https://code.forgejo.org/actions/upload-artifact@v7.0.2
        with:
          name: voix-x86_64-bin
          path: voix-x86_64-bin.tar.gz

  publish:
    name: Sign and publish release
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Checkout repository at the release tag
        uses: https://code.forgejo.org/actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Install publish tools
        run: |
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi
          # jq and curl are used by forgejo-release; gnupg signs the assets.
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            ca-certificates curl jq git gnupg
          gpg --version | head -n 1

      - name: Download build artifacts
        uses: https://code.forgejo.org/actions/download-artifact@v8.0.2
        with:
          name: voix-x86_64-bin
          path: dist

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.gnupg"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          gpg --batch --with-colons --list-secret-keys \
            | grep -q "^fpr:::::::::${GPG_FINGERPRINT}:$" \
            || { echo "error: signing key ${GPG_FINGERPRINT} missing after import" >&2; exit 1; }

      # The source archive is produced from the checked-out tag with an explicit
      # prefix instead of being downloaded from the forge: GitHub's tarball
      # strips the leading `v` from the ref while Forgejo keeps it, and the AUR
      # PKGBUILDs require the `Voix-$pkgver/` prefix.
      - name: Build the source archive for the tag
        run: |
          set -euo pipefail
          ver="${RELEASE_TAG#v}"
          archive="dist/voix-src-${ver}.tar.gz"
          git archive --format=tar.gz --prefix="Voix-${ver}/" \
            -o "$archive" "$RELEASE_TAG"
          first_entry=$(tar -tzf "$archive" | head -n 1)
          if [ "$first_entry" != "Voix-${ver}/" ]; then
            echo "error: source archive is not prefixed with Voix-${ver}/ (got '${first_entry}')" >&2
            exit 1
          fi
          tar -tzf "$archive" | grep -qx "Voix-${ver}/CMakeLists.txt" \
            || { echo "error: source archive is missing CMakeLists.txt" >&2; exit 1; }
          ls -l dist

      - name: Sign artifacts (detached, armored)
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          sign() {
            local file="$1"
            printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes \
              --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "$GPG_FINGERPRINT" \
              --armor --detach-sign --output "${file}.asc" "$file"
            gpg --batch --verify "${file}.asc" "$file"
          }
          ver="${RELEASE_TAG#v}"
          sign "dist/voix-x86_64-bin.tar.gz"
          sign "dist/voix-src-${ver}.tar.gz"
          ls -l dist

      # Kept outside dist: forgejo-release uploads every file in release-dir.
      - name: Generate release notes
        run: |
          set -euo pipefail
          mkdir -p .release
          prev=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            range="${prev}..${RELEASE_TAG}"
            heading="Changes since ${prev}"
          else
            range="${RELEASE_TAG}"
            heading="Changes"
          fi
          {
            echo "## ${heading}"
            echo
            git log --no-merges --pretty='- %s (`%h`)' "$range"
            echo
            echo "Every asset has a detached armored signature (\`.asc\`) made with"
            echo "key \`${GPG_FINGERPRINT}\`."
          } > .release/notes.md
          cat .release/notes.md

      # `url` and `token` are left at the action's defaults, which resolve to
      # this instance's FORGEJO_SERVER_URL and the run's automatic token.
      # `override: true` deletes and recreates the release for an existing tag,
      # which is what makes rebuilding a cut release idempotent.
      - name: Create / update release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          tag: ${{ needs.resolve.outputs.tag }}
          release-dir: dist
          release-notes-file: .release/notes.md
          hide-archive-link: 'true'
          override: 'true'
          verbose: 'true'
